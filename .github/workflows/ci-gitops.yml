name: Azure ACR Build & GitOps Manifest Update

on:
  push:
    branches: [ "main" ]
    paths:
      - 'app/**'
      - '.github/workflows/ci-gitops.yml'

permissions:
  contents: write # Allows GitHub Actions to commit the new image SHA back to the repo

env:
  ACR_NAME: acrgitopsgehan2026 # Replace with your ACR name
  ACR_LOGIN_SERVER: acrgitopsgehan2026.azurecr.io
  BACKEND_IMAGE: gitops-backend
  FRONTEND_IMAGE: gitops-frontend

jobs:
  build-and-update-manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login via Service Principal
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry (ACR)
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build, Tag, and Push Docker Images to ACR
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          SHORT_SHA=$(echo $IMAGE_TAG | cut -c1-7)

          # Build & Push Backend
          docker build -t $ACR_LOGIN_SERVER/$BACKEND_IMAGE:$SHORT_SHA ./app/backend
          docker push $ACR_LOGIN_SERVER/$BACKEND_IMAGE:$SHORT_SHA

          # Build & Push Frontend
          docker build -t $ACR_LOGIN_SERVER/$FRONTEND_IMAGE:$SHORT_SHA ./app/frontend
          docker push $ACR_LOGIN_SERVER/$FRONTEND_IMAGE:$SHORT_SHA

          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV

      - name: Update Kubernetes Manifests with New ACR Image Tag
        run: |
          sed -i "s|image: .*gitops-backend:.*|image: ${ACR_LOGIN_SERVER}/${BACKEND_IMAGE}:${SHORT_SHA}|g" k8s/backend-deployment.yaml
          sed -i "s|image: .*gitops-frontend:.*|image: ${ACR_LOGIN_SERVER}/${FRONTEND_IMAGE}:${SHORT_SHA}|g" k8s/frontend-deployment.yaml

      - name: Commit & Push Updated Manifests for ArgoCD
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/*.yaml
          git commit -m "chore(gitops): update AKS image tags to ${SHORT_SHA} [skip ci]" || echo "No changes to commit"
          git push