apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: azure-aks-gitops-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/GehanLiyanage2002/cloud-native-gitops-azure.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true      # Removes Kubernetes resources deleted from Git
      selfHeal: true   # Reverts manual kubectl edits back to desired Git state